show_message:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: bed_projector
    message:
      required: true
      example: Lavatrice finita
      selector:
        text:
    icon:
      selector:
        select:
          translation_key: icon
          options:
            - "bell"
            - "information"
            - "alert"
            - "washing-machine"
            - "package-variant"
            - "door-open"
            - "lightbulb-on"
            - "phone"
            - "alarm"
            - "calendar"
    duration:
      default: 30
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: s
    level:
      default: info
      selector:
        select:
          translation_key: level
          options:
            - "info"
            - "warning"
            - "alert"
    blink:
      default: false
      selector:
        boolean:
clear_message:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: bed_projector
